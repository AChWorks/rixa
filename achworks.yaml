schemaVersion: achworks.dev/v1alpha1
kind: Product

metadata:
  name: rixa
  title: Rixa
  description: Lightweight CMS product with independently owned site data and semantic static publication, built on pinned AChrix public contracts.

spec:
  type: content-management-system
  lifecycle: development
  system: rixa
  ownership: AChWorks

  technology:
    languages:
      - Go
    frameworks: []
    runtimes: []

  capabilities:
    provides:
      - content-management
      - semantic-static-publication
      - isolated-site-runtime
    consumes:
      - versioned-application-base
      - application-module-composition
      - application-capability-contracts

  dependencies:
    - AChWorks/achrix

  documentation:
    path: docs/

  source:
    repository: AChWorks/rixa
    url: https://github.com/AChWorks/rixa

  extensions:
    foundation:
      repository: AChWorks/achrix
      sourceVersion: v0.4.0
      components:
        github.com/AChWorks/achrix: v0.4.0
        github.com/AChWorks/achrix/admin: v0.1.0
        github.com/AChWorks/achrix/audit: v0.1.0
        github.com/AChWorks/achrix/identity: v0.1.0
        github.com/AChWorks/achrix/media: v0.1.0
        github.com/AChWorks/achrix/multisite: v0.1.0
      consumption: versioned-go-dependency
      specification: docs/PROJECT-SPEC.md

name: Code-first Theme Browser

on:
  pull_request:
    paths:
      - ".github/workflows/theme-browser.yml"
      - "go.mod"
      - "go.sum"
      - "internal/product/**"
      - "scripts/lab/theme-browser.cjs"
      - "scripts/lab/run-theme-browser.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-theme-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      GOWORK: "off"
      RIXA_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned Chromium tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rixa-theme-playwright" --no-package-lock --no-save --ignore-scripts --no-audit --no-fund playwright@1.61.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/rixa-theme-browsers" \
            "$RUNNER_TEMP/rixa-theme-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real two-site HTTPS Theme workflow
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/rixa-theme-playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rixa-theme-browsers
        run: bash scripts/lab/run-theme-browser.sh

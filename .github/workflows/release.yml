name: Release package

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
      - "scripts/verify-release.sh"
      - "scripts/verify-dependencies.sh"
      - "scripts/publish-release.py"
      - "scripts/fetch-verification-helper.sh"
      - "scripts/tests/test_publish_release.py"
      - "docs/release-install.md"
      - "internal/product/version.go"
      - "cmd/rixa/**"
      - "internal/releaseartifact/**"
      - ".env.example"
      - "config/rixa.example.json"
      - "LICENSE"
      - "achworks.yaml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package without publishing (for example v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      GOWORK: "off"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve package identity
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="v0.0.0-ci"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "invalid package version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=rixa-${version}-linux-amd64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Test publication failure and acknowledgement boundaries
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_publish_release.py' -v

      - name: Verify pinned publisher helper readiness
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/fetch-verification-helper.sh "$RUNNER_TEMP/rixa-verifier"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "${{ steps.meta.outputs.version }}" "$GITHUB_SHA" dist

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          archive="dist/rixa-${version}-linux-amd64.tar.gz"
          achrix="$(GOWORK=off go list -m -f '{{.Version}}' github.com/AChWorks/achrix)"
          ./scripts/verify-release.sh "$archive" "${archive}.sha256" "$version" "$GITHUB_SHA" "$achrix"

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'AChWorks/rixa'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist

      - name: Prepare pinned provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          helper="$(./scripts/fetch-verification-helper.sh "$RUNNER_TEMP/rixa-verifier")"
          echo "$(dirname "$helper")" >> "$GITHUB_PATH"

      - name: Recheck protected source, tag, package and release absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/publish-release.py check "dist/rixa-${GITHUB_REF_NAME}-linux-amd64.tar.gz"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build verifier from protected source
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/rixa-provenance-verifier" ./cmd/rixa

      - name: Attest exact release archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rixa-${{ github.ref_name }}-linux-amd64.tar.gz
          create-storage-record: false

      - name: Retain local provenance bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 0644 "$ATTESTATION_BUNDLE" "dist/rixa-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sigstore.json"

      - name: Verify provenance and publish complete draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIXA_PROVENANCE_VERIFIER: ${{ runner.temp }}/rixa-provenance-verifier
        run: |
          set -euo pipefail
          python3 scripts/publish-release.py publish "dist/rixa-${GITHUB_REF_NAME}-linux-amd64.tar.gz"

      - name: Retain provenance evidence after signing
        if: always() && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 7

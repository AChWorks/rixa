name: Runtime

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      GOWORK: "off"
      RIXA_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependency mode and complete component identity
        run: ./scripts/verify-dependencies.sh

      - name: Verify module manifests
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Runtime proof
        run: go test -race ./...

      - name: Measure resource profile
        env:
          RIXA_RESOURCE_OBSERVATION: "1"
        run: go test -race ./internal/product -run '^TestRuntimeResourceBoundProfile$' -count=1 -v

      - name: Prove site transfer round trip
        env:
          RIXA_SITE_TRANSFER_OBSERVATION: "1"
        run: go test -race ./internal/product -run '^TestSiteTransferRoundTrip$' -count=1 -v

      - name: Prove retained published-release upgrade
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(./scripts/fetch-upgrade-baseline.sh "$RUNNER_TEMP/rixa-upgrade-baseline")"
          RIXA_RETAINED_UPGRADE_OBSERVATION=1 \
          RIXA_UPGRADE_BASELINE_BINARY="$baseline" \
          go test -race ./internal/product -run '^TestRetainedReleaseUpgrade$' -count=1 -v

      - name: Measure static HTTPS path
        run: go test ./internal/product -run '^$' -bench '^BenchmarkStaticPublicationHTTPSRead$' -benchtime=250ms -count=1 -benchmem

      - name: Build product
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/rixa" ./cmd/rixa
          "$RUNNER_TEMP/rixa" version
